name: LogiPulse Autonomous CI/CD Pipeline

on:
  push:
    branches: [main, phase-1]
  pull_request:
    branches: [main, phase-1]

jobs:
  backend-ci:
    name: Backend Test Suite (FastAPI + LangGraph + Tools)
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'mock-key-for-ci' }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY || 'mock-key-for-ci' }}
      ORS_API_KEY: ${{ secrets.ORS_API_KEY || 'mock-key-for-ci' }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Backend Test Suite
        run: |
          pytest tests/ -v --junitxml=backend-test-results.xml

  frontend-ci:
    name: Frontend Test & Build (React + Vite + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Vitest Frontend Unit Tests
        run: npm test

      - name: Build Vite Production Assets
        run: npm run build
