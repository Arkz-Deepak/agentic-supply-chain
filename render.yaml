services:
  - type: web
    name: agentic-supply-chain-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --app-dir src --host 0.0.0.0 --port 
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: MAP_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
